<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: #fff;
            transition: 0.5s ease;
        }
         header {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: stretch;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
        }

        header .logo img {
            height: 35px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li {
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            padding: 5px 10px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ddd;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropbtn {
            background: transparent;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 5px 10px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #333;
            min-width: 150px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: white;
            padding: 10px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #444;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.171);
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1920px;
            height: 100vh;
            gap: 0;
            background: radial-gradient(rgb(0 0 0 / 62%), rgba(0, 0, 0, 0.3));
            position: relative;
        }

        .card {
            flex: 1;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: flex 0.5s ease;
        }

        .card:hover {
            flex: 3;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.2);
        }
        .card .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.25);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover .background {
            opacity: 1;
        }

        .layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }
        .card:hover .layer {
            opacity: 1;
        }

        .info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="Canvas Logo">
        </a>
        <nav>
            <ul>
                <li class="dropdown">
                    <button class="dropbtn">MEDREA</button>
                    <div class="dropdown-content">
                        <a href="AR.html">AR</a>
                        <a href="VR.html">VR</a>
                        <a href="MR.html">MR</a>
                        <a href="AI.html">AI</a>
                    </div>
                </li>
                <li><a href="#">WHO WE ARE</a></li>
                <li><a href="#">WHAT WE DO</a></li>
                <li><a href="#">CONNECT</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <img src="img/Fuji-Mountain.jpg" alt="Fuji Mountain">
            <div class="layer">
                <div class="info">
                    <h1>AR</h1>
                    <p>AUGMENTED REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Marina-Bay.jpg" alt="Marina Bay">
            <div class="layer">
                <div class="info">
                    <h1>VR</h1>
                    <p>VIRTUAL REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Statue-Liberty.jpg" alt="Statue of Liberty">
            <div class="layer">
                <div class="info">
                    <h1>MR</h1>
                    <p>MIXED REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Taj-Mahal.jpg" alt="Taj Mahal">
            <div class="layer">
                <div class="info">
                    <h1>AI</h1>
                    <p>ARTIFICIAL INTELLIGENCE</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
