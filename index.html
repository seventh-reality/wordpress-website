<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Image Hover Effect</title>
     <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           font-family: sans-serif;
           color: #fff;
           transition: .5s ease;
       }
       body {
           width: 100%;
           height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           background: radial-gradient(circle, rgba(34,193,195,1) 0%, rgba(253,187,45,1) 100%);
       }
       header {
           width: 100%;
           height: 60px;
           display: flex;
           align-items: center;
           justify-content: center;
           padding: 0 20px;
           position: fixed;
           top: 0;
           z-index: 1;
           background: rgba(0, 0, 0, 0.3);
       }
       header nav ul {
           display: flex;
           list-style: none;
       }
       header nav ul li {
           margin-left: 50px;
       }
       header nav ul li a {
           text-decoration: none;
           color: #fff;
           font-size: 12px;
       }
       .container {
           width: 100%;
           display: flex;
           gap: 10px;
           justify-content: center;
           align-items: center;
       }
       .container .card {
           width: 25%;
           cursor: pointer;
           overflow: hidden;
       }
       .container .card:hover {
           width: 100%;
       }
       .container .card .image {
           width: 100%;
           height: 100%;
           object-fit: cover;
       }
     </style>
</head>
<body>
     <header>
          <nav>
              <ul>
                  <li><a href="#">WHO WE ARE</a></li>
                  <li><a href="#">WHAT WE DO</a></li>
                  <li><a href="#">CONNECT</a></li>
              </ul>
          </nav>
      </header>
     <div class="container">
          <div class="card">
               <img src="img/Fuji-Mountain.jpg" alt="Fuji Mountain" class="image">
          </div>
          <div class="card">
               <img src="img/Marina-Bay.jpg" alt="Marina Bay" class="image">
          </div>
          <div class="card">
               <img src="img/Status-Liberty.jpg" alt="Status Liberty" class="image">
          </div>
          <div class="card">
               <img src="img/Taj-Mahal.jpg" alt="Taj Mahal" class="image">
          </div>
     </div>
</body>
</html>
