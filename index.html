<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Image Hover Effect</title>
     <style>
       * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: sans-serif;
         color: #fff;
         transition: .5s ease;
       }
       body {
         width: 100%;
         height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         background: radial-gradient(circle, rgba(34,34,34,1) 0%, rgba(0,0,0,1) 100%);
       }
       .container {
         width: 1920px;
         height: 1080px;
         display: flex;
         gap: 0px;
       }
       .container .card {
         width: 25%;
         border-radius: 0px;
         cursor: pointer;
         overflow: hidden;
         position: relative;
       }
       .container .card:hover {
         width: 100%;
       }
       .container .card .image {
         width: 100%;
         height: 100%;
         object-fit: cover;
       }
       .container .card:hover .image {
         transform: scale(1.2);
       }
       .container .card .background {
         position: absolute;
         left: 0;
         top: 0;
         z-index: -1;
         width: 100%;
         height: 100vh;
         object-fit: cover;
         pointer-events: none;
         filter: brightness(0.25);
         opacity: 0;
         background: radial-gradient(circle, rgba(0,0,0,0.7) 10%, transparent 80%);
       }
       .container .card:hover .background {
         opacity: 1;
       }
       .container .card .layer {
         width: 100%;
         height: 50%;
         margin-top: -250px;
         position: relative;
         background: radial-gradient(circle, rgba(0, 0, 0, 0.9) 10%, transparent 80%);
       }
       .container .card .layer .info {
         width: 260px;
         position: absolute;
         bottom: 10px;
         padding: 20px;
         opacity: 0;
       }
       .container .card:hover .layer .info {
         opacity: 1;
       }
       .container .card:hover .layer .info h1 {
         font-size: 30px;
       }
       .container .card:hover .layer .info p {
         color: rgba(255, 255, 255, 0.7);
         margin-top: 20px;
       }
     </style>
</head>
<body>
     <div class="container">
          <div class="card">
               <img src="img/Fuji-Mountain.jpg" alt="" class="image">
               <img src="img/Fuji-Mountain.jpg" alt="" class="background">
               <div class="layer">
                    <div class="info">
                         <h1>Fuji Mountain</h1>
                         <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
                    </div>
               </div>
          </div>
          <div class="card">
               <img src="img/Marina-Bay.jpg" alt="" class="image">
               <img src="img/Marina-Bay.jpg" alt="" class="background">
               <div class="layer">
                    <div class="info">
                         <h1>Marina Bay</h1>
                         <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
                    </div>
               </div>
          </div>
     </div>
</body>
</html>
