<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: #fff;
        }
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            flex: 1;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: flex 0.5s ease;
        }
        .card:hover {
            flex: 2;
        }
        .card .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover .image {
            transform: scale(1.1);
        }
        .layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            display: flex;
            align-items: flex-end;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .card:hover .layer {
            opacity: 1;
        }
        .info h1 {
            font-size: 24px;
        }
        .info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="img/Fuji-Mountain.jpg" class="image" alt="Fuji Mountain">
            <div class="layer">
                <div class="info">
                    <h1>Fuji Mountain</h1>
                    <p>Discover the beauty of Japan’s iconic peak.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Marina-Bay.jpg" class="image" alt="Marina Bay">
            <div class="layer">
                <div class="info">
                    <h1>Marina Bay</h1>
                    <p>Experience the stunning skyline of Singapore.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Status-Liberty.jpg" class="image" alt="Statue of Liberty">
            <div class="layer">
                <div class="info">
                    <h1>Statue of Liberty</h1>
                    <p>A symbol of freedom in New York.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Taj-Mahal.jpg" class="image" alt="Taj Mahal">
            <div class="layer">
                <div class="info">
                    <h1>Taj Mahal</h1>
                    <p>Marvel at India’s architectural wonder.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
