<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Responsive Image Hover</title>
     <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: #fff;
            transition: .5s ease;
        }
        body {
            background-color: rgba(0, 0, 0, 0.171);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2;
        }
        .container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            padding: 80px 20px 20px;
        }
        .card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }
        .card .image {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .card .layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
        }
        .card .info {
            opacity: 1;
            transition: opacity 0.5s;
        }
        .card:hover .info {
            opacity: 1;
        }
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
     </style>
</head>
<body>
     <header>
          <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo" style="height: 50px;"></a>
     </header>
     <div class="container">
          <div class="card">
               <img src="img/Fuji-Mountain.jpg" alt="Fuji Mountain" class="image">
               <div class="layer">
                    <div class="info">
                         <h1>Fuji Mountain</h1>
                         <p>Beautiful scenery of Mount Fuji.</p>
                    </div>
               </div>
          </div>
          <div class="card">
               <img src="img/Marina-Bay.jpg" alt="Marina Bay" class="image">
               <div class="layer">
                    <div class="info">
                         <h1>Marina Bay</h1>
                         <p>Iconic view of Singapore's Marina Bay.</p>
                    </div>
               </div>
          </div>
          <div class="card">
               <img src="img/Status-Liberty.jpg" alt="Statue of Liberty" class="image">
               <div class="layer">
                    <div class="info">
                         <h1>Statue of Liberty</h1>
                         <p>A symbol of freedom in New York.</p>
                    </div>
               </div>
          </div>
          <div class="card">
               <img src="img/Taj-Mahal.jpg" alt="Taj Mahal" class="image">
               <div class="layer">
                    <div class="info">
                         <h1>Taj Mahal</h1>
                         <p>A breathtaking masterpiece in India.</p>
                    </div>
               </div>
          </div>
     </div>
</body>
</html>
