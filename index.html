<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: #fff;
            transition: 0.5s ease;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.171);
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1920px;
            height: 100vh;
            gap: 0;
            background: radial-gradient(rgb(0 0 0 / 62%), rgba(0, 0, 0, 0.3));
            position: relative;
        }

        .card {
            flex: 1;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: flex 0.5s ease;
        }

        .card:hover {
            flex: 3;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.2);
        }

        .layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="img/Fuji-Mountain.jpg" alt="Fuji Mountain">
            <div class="layer">
                <div class="info">
                    <h1>AR</h1>
                    <p>AUGMENTED REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Marina-Bay.jpg" alt="Marina Bay">
            <div class="layer">
                <div class="info">
                    <h1>VR</h1>
                    <p>VIRTUAL REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Statue-Liberty.jpg" alt="Statue of Liberty">
            <div class="layer">
                <div class="info">
                    <h1>MR</h1>
                    <p>MIXED REALITY</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Taj-Mahal.jpg" alt="Taj Mahal">
            <div class="layer">
                <div class="info">
                    <h1>AI</h1>
                    <p>ARTIFICIAL INTELLIGENCE</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
