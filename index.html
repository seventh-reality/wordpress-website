<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Image Hover Effect</title>
     <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           font-family: sans-serif;
           color: #fff;
           transition: .5s ease;
       }
       
       body {
           width: 100%;
           height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           background-color: rgba(0, 0, 0, 0.171);
           position: relative;
       }
       body::before {
           content: "";
           background: #fff;
           position: absolute;
           width: 100%;
           height: 100vh;
           background-size: cover;
           background-position: center;
           background-repeat: no-repeat;
           filter: brightness(0.25);
           z-index: -1;
           background-color: rgba(0, 0, 0, 0.171);
       }
       .container {
           width: 1920px;
           height: 1080px;
           display: flex;
           gap: 0px;
           position: relative;
           background: linear-gradient(#a61918, #00f2fe);
       }
       .container .card {
           width: 25%;
           border-radius: 0px;
           cursor: pointer;
           overflow: hidden;
           position: relative;
       }
       .container .card:hover {
           width: 100%;
       }
       .container .card .image {
           width: 100%;
           height: 100%;
           object-fit: cover;
       }
       .container .card:hover .image {
           transform: scale(1.2);
       }
       .container .card .background {
           position: absolute;
           left: 0;
           top: 0;
           z-index: -1;
           width: 100%;
           height: 100vh;
           object-fit: cover;
           pointer-events: none;
           filter: brightness(0.25);
           opacity: 0;
           background: linear-gradient(#a61918, #00f2fe);
       }
       .container .card:hover .background {
           opacity: 1;
       }
     </style>
</head>
<body>
    <div class="color-overlay"></div>
    <div class="container">
        <div class="card">
            <img src="img/Fuji-Mountain.jpg" alt="Fuji Mountain" class="image">
            <img src="img/Fuji-Mountain.jpg" alt="" class="background">
            <div class="layer">
                <div class="info">
                    <h1>Fuji Mountain</h1>
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Marina-Bay.jpg" alt="Marina Bay" class="image">
            <img src="img/Marina-Bay.jpg" alt="" class="background">
            <div class="layer">
                <div class="info">
                    <h1>Marina Bay</h1>
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Status-Liberty.jpg" alt="Status Liberty" class="image">
            <img src="img/Status-Liberty.jpg" alt="" class="background">
            <div class="layer">
                <div class="info">
                    <h1>Status Liberty</h1>
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
                </div>
            </div>
        </div>
        <div class="card">
            <img src="img/Taj-Mahal.jpg" alt="Taj Mahal" class="image">
            <img src="img/Taj-Mahal.jpg" alt="" class="background">
            <div class="layer">
                <div class="info">
                    <h1>Taj Mahal</h1>
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
